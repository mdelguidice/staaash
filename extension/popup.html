<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stash</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #fafaf7;
      color: #1a1a1a;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid rgba(26,26,26,0.08);
    }

    .logo {
      width: 24px;
      height: 24px;
      background: #1a1a1a;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo svg { display: block; }

    .header-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; }

    .url-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(26,26,26,0.04);
      border: 1px solid rgba(26,26,26,0.08);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .favicon {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .favicon-placeholder {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      background: rgba(26,26,26,0.12);
      flex-shrink: 0;
    }

    .url-text {
      font-size: 12px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .title-text {
      font-size: 13px;
      font-weight: 500;
      color: #1a1a1a;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    textarea {
      width: 100%;
      background: #fff;
      border: 1px solid rgba(26,26,26,0.12);
      border-radius: 8px;
      padding: 9px 10px;
      font-family: inherit;
      font-size: 13px;
      color: #1a1a1a;
      resize: none;
      height: 72px;
      outline: none;
      transition: border-color 0.15s;
      line-height: 1.5;
    }

    textarea::placeholder { color: #aaa; }
    textarea:focus { border-color: rgba(26,26,26,0.3); }

    .save-btn {
      width: 100%;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: -0.1px;
    }

    .save-btn:hover { opacity: 0.88; }
    .save-btn:active { transform: scale(0.98); }
    .save-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

    .status {
      font-size: 12px;
      text-align: center;
      padding: 2px 0;
      min-height: 18px;
      color: #888;
    }

    .status.success { color: #22863a; font-weight: 500; }
    .status.error { color: #cb2431; }
    .status.duplicate { color: #b08000; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M2 2.5C2 2.22 2.22 2 2.5 2h9c.28 0 .5.22.5.5v9a.5.5 0 0 1-.8.4L7 9.5l-4.2 2.4A.5.5 0 0 1 2 11.5v-9Z" fill="white"/>
      </svg>
    </div>
    <span class="header-title">Stash</span>
  </div>

  <div class="body">
    <div class="url-row">
      <img id="favicon" class="favicon" src="" alt="" style="display:none">
      <div id="favicon-placeholder" class="favicon-placeholder"></div>
      <span id="url-text" class="url-text"></span>
    </div>

    <div id="page-title" class="title-text"></div>

    <textarea id="note" placeholder="Add a note… (optional)"></textarea>

    <button id="save-btn" class="save-btn">Save to Stash</button>
    <div id="status" class="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
